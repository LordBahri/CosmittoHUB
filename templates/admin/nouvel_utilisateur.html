{% extends "base.html" %}
{% block title %}Nouvel Utilisateur - {{ super() }}{% endblock %}
{% block content %}
<div class="page-header"><h1>Nouvel Utilisateur</h1></div>
<form method="POST" class="form-card">
    <div class="form-group"><label>Nom *</label><input type="text" name="nom" required class="form-input"></div>
    <div class="form-group"><label>Prénom *</label><input type="text" name="prenom" required class="form-input"></div>
    <div class="form-group"><label>Email *</label><input type="email" name="email" required class="form-input"></div>
    <div class="form-group"><label>Mot de passe *</label><input type="password" name="password" required class="form-input"></div>
    <div class="form-group">
        <label>Rôle</label>
        <select name="role" class="form-input">
            <option value="utilisateur">Utilisateur</option>
            <option value="technicien">Technicien</option>
            <option value="responsable">Responsable</option>
            <option value="admin">Administrateur</option>
        </select>
    </div>
    <div class="form-actions">
        <a href="{{ url_for('admin.utilisateurs') }}" class="btn btn-outline">Annuler</a>
        <button type="submit" class="btn btn-primary">Créer</button>
    </div>
</form>
{% endblock %}
