{% extends "base.html" %}

{% block title %}New User{% endblock %}

{% block content %}
<div class="page">

  <!-- Page Header -->
  <div class="page-header">
    <div class="page-header-left">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="{{ url_for('admin.tableau_bord') }}" class="breadcrumb-link">Admin</a>
        <span class="breadcrumb-sep">/</span>
        <a href="{{ url_for('admin.utilisateurs') }}" class="breadcrumb-link">Users</a>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-current">New User</span>
      </nav>
      <h1 class="page-title" style="margin-top:4px;">New User</h1>
    </div>
    <div class="page-header-actions">
      <a href="{{ url_for('admin.utilisateurs') }}" class="btn btn-ghost btn-sm">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Users
      </a>
    </div>
  </div>

  <!-- Form -->
  <div style="max-width:680px;">
    <form method="POST" action="{{ url_for('admin.nouvel_utilisateur') }}" id="newUserForm">

      <!-- Section: Personal Information -->
      <div class="card card-raised" style="margin-bottom:20px;">
        <div class="card-header">
          <div class="card-title">Personal Information</div>
        </div>
        <div class="card-body" style="padding:24px;">

          <!-- First name + Last name -->
          <div class="form-row" style="margin-bottom:16px;">
            <div class="form-group">
              <label class="form-label" for="prenom">First Name <span style="color:var(--error);">*</span></label>
              <input
                type="text"
                id="prenom"
                name="prenom"
                class="input"
                placeholder="Jean"
                required
                autofocus
                autocomplete="given-name"
                value="{{ request.form.get('prenom', '') }}"
              >
            </div>
            <div class="form-group">
              <label class="form-label" for="nom">Last Name <span style="color:var(--error);">*</span></label>
              <input
                type="text"
                id="nom"
                name="nom"
                class="input"
                placeholder="Dupont"
                required
                autocomplete="family-name"
                value="{{ request.form.get('nom', '') }}"
              >
            </div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email">Email Address <span style="color:var(--error);">*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              class="input"
              placeholder="jean.dupont@company.com"
              required
              autocomplete="email"
              value="{{ request.form.get('email', '') }}"
            >
          </div>

        </div>
      </div>

      <!-- Section: Account -->
      <div class="card card-raised" style="margin-bottom:20px;">
        <div class="card-header">
          <div class="card-title">Account</div>
        </div>
        <div class="card-body" style="padding:24px;">

          <!-- Password -->
          <div class="form-group" style="margin-bottom:16px;">
            <label class="form-label" for="password">Password <span style="color:var(--error);">*</span></label>
            <input
              type="password"
              id="password"
              name="password"
              class="input"
              placeholder="Minimum 8 characters"
              required
              autocomplete="new-password"
              minlength="8"
            >
            <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">Must be at least 8 characters long.</p>
          </div>

          <!-- Role + Department -->
          <div class="form-row" style="margin-bottom:0;">
            <div class="form-group">
              <label class="form-label" for="role">Role <span style="color:var(--error);">*</span></label>
              <div class="select-wrap">
                <select id="role" name="role" class="select" required>
                  <option value="">Select a role...</option>
                  <option value="Administrateur" {% if request.form.get('role') == 'Administrateur' %}selected{% endif %}>Administrator</option>
                  <option value="Manager" {% if request.form.get('role') == 'Manager' %}selected{% endif %}>Manager</option>
                  <option value="Agent" {% if request.form.get('role') == 'Agent' %}selected{% endif %}>Agent</option>
                  <option value="Utilisateur" {% if not request.form.get('role') or request.form.get('role') == 'Utilisateur' %}selected{% endif %}>User</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="departement_id">Department</label>
              <div class="select-wrap">
                <select id="departement_id" name="departement_id" class="select">
                  <option value="">No department</option>
                  {% for dept in departements %}
                  <option value="{{ dept.id }}" {% if request.form.get('departement_id')|string == dept.id|string %}selected{% endif %}>
                    {{ dept.nom }}
                  </option>
                  {% endfor %}
                </select>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Section: Profile (optional) -->
      <div class="card card-raised" style="margin-bottom:24px;">
        <div class="card-header">
          <div class="card-title">Profile <span style="font-weight:400;font-size:12px;color:var(--text-muted);margin-left:6px;">Optional</span></div>
        </div>
        <div class="card-body" style="padding:24px;">

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="poste">Job Title</label>
              <input
                type="text"
                id="poste"
                name="poste"
                class="input"
                placeholder="e.g. Support Engineer"
                autocomplete="organization-title"
                value="{{ request.form.get('poste', '') }}"
              >
            </div>
            <div class="form-group">
              <label class="form-label" for="matricule">Employee ID</label>
              <input
                type="text"
                id="matricule"
                name="matricule"
                class="input"
                placeholder="e.g. EMP-0042"
                autocomplete="off"
                value="{{ request.form.get('matricule', '') }}"
              >
            </div>
          </div>

        </div>
      </div>

      <!-- Form Actions -->
      <div class="form-actions" style="display:flex;align-items:center;gap:12px;justify-content:flex-end;">
        <a href="{{ url_for('admin.utilisateurs') }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary btn-lg">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Create User
        </button>
      </div>

    </form>
  </div>

</div><!-- /page -->
{% endblock %}
