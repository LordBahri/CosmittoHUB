{% extends "base.html" %}
{% block title %}Modifier Utilisateur - {{ super() }}{% endblock %}
{% block content %}
<div class="page-header"><h1>Modifier Utilisateur</h1></div>
<form method="POST" class="form-card">
    <div class="form-group"><label>Nom *</label><input type="text" name="nom" value="{{ utilisateur.nom }}" required class="form-input"></div>
    <div class="form-group"><label>Prénom *</label><input type="text" name="prenom" value="{{ utilisateur.prenom }}" required class="form-input"></div>
    <div class="form-group"><label>Email *</label><input type="email" name="email" value="{{ utilisateur.email }}" required class="form-input"></div>
    <div class="form-group"><label>Nouveau mot de passe</label><input type="password" name="nouveau_password" class="form-input"></div>
    <div class="form-group">
        <label>Rôle</label>
        <select name="role" class="form-input">
            <option value="utilisateur" {% if utilisateur.role == 'utilisateur' %}selected{% endif %}>Utilisateur</option>
            <option value="technicien" {% if utilisateur.role == 'technicien' %}selected{% endif %}>Technicien</option>
            <option value="responsable" {% if utilisateur.role == 'responsable' %}selected{% endif %}>Responsable</option>
            <option value="admin" {% if utilisateur.role == 'admin' %}selected{% endif %}>Administrateur</option>
        </select>
    </div>
    <div class="form-group">
        <label><input type="checkbox" name="actif" {% if utilisateur.actif %}checked{% endif %}> Compte actif</label>
    </div>
    <div class="form-actions">
        <a href="{{ url_for('admin.utilisateurs') }}" class="btn btn-outline">Annuler</a>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
    </div>
</form>
{% endblock %}
