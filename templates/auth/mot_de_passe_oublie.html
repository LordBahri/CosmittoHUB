{% extends "base.html" %}
{% block title %}Mot de passe oublié - {{ super() }}{% endblock %}
{% block auth_content %}
<div class="auth-container">
    <div class="auth-box">
        <h1>Réinitialiser le mot de passe</h1>
        <form method="POST">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required class="form-input">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Envoyer le lien</button>
        </form>
        <p><a href="{{ url_for('auth.connexion') }}">Retour à la connexion</a></p>
    </div>
</div>
{% endblock %}
